[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novelpilot"
version = "0.1.0"
description = "The AI novel engine that actually writes books."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pixelwitch" }]
keywords = ["ai", "fiction", "novel", "writing", "llm", "publishing", "kdp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-docx>=1.1",
    "cairosvg>=2.7",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "sse-starlette>=2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10"]
embeddings = ["sentence-transformers>=3.0", "numpy>=1.26"]

[project.scripts]
novelpilot = "novelpilot.cli:main"

[project.urls]
Homepage = "https://novelpilot.ai"
Repository = "https://github.com/Amrree/novelpilot"
Issues = "https://github.com/Amrree/novelpilot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
